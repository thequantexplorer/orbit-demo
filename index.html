<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit — a considered workspace for the ideas, fixes, and finishing touches that move your project forward."
    />
    <meta name="theme-color" content="#131211" />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('orbit-editorial-theme') === 'light' ? 'light' : 'dark'
      } catch {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <title>Product launch · Orbit</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
